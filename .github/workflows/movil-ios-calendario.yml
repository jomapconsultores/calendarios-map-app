# ------------------------------------------------------------
# Desarrollado por Marco Antonio Posligua San Martín
# ------------------------------------------------------------
# Compila la app de iOS de Calendarios MAP.
#
# iOS solo se puede firmar desde macOS con Xcode, y en el equipo no hay Mac: por
# eso este flujo usa un runner macos de GitHub Actions. Sin los certificados de
# Apple en los secretos compila SIN FIRMAR: sirve para comprobar que el proyecto
# está sano, no para instalar en un teléfono ni subir a App Store.

name: App iOS — Calendarios MAP

on:
  workflow_dispatch:
    inputs:
      app_url:
        description: "Dirección del despliegue que abrirá la app (deja vacío para usar la variable APP_URL)"
        required: false
        type: string

jobs:
  ipa:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: movil

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar el proyecto iOS
        env:
          APP_URL: ${{ inputs.app_url || vars.APP_URL }}
        run: npx cap add ios || npx cap sync ios

      - name: Instalar los pods de CocoaPods
        working-directory: movil/ios/App
        run: pod install

      - name: Instalar certificado y perfil de aprovisionamiento
        id: firma
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          if [ -z "$CERT_B64" ] || [ -z "$PROFILE_B64" ]; then
            echo "Sin certificados de Apple: se compilará sin firmar."
            echo "firmado=no" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Llavero temporal: se destruye con el runner, no queda nada persistido.
          LLAVERO=$RUNNER_TEMP/firma.keychain-db
          CLAVE=$(uuidgen)
          security create-keychain -p "$CLAVE" "$LLAVERO"
          security set-keychain-settings -lut 21600 "$LLAVERO"
          security unlock-keychain -p "$CLAVE" "$LLAVERO"
          echo "$CERT_B64" | base64 -d > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 -P "$CERT_PASSWORD" -A \
            -t cert -f pkcs12 -k "$LLAVERO"
          security list-keychain -d user -s "$LLAVERO"
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/perfil.mobileprovision
          echo "firmado=si" >> "$GITHUB_OUTPUT"

      - name: Archivar y exportar el .ipa
        if: steps.firma.outputs.firmado == 'si'
        working-directory: movil/ios/App
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -archivePath $RUNNER_TEMP/App.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" archive
          cat > $RUNNER_TEMP/export.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>$TEAM_ID</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/export.plist \
            -exportPath $RUNNER_TEMP/export

      - name: Compilar sin firmar (comprobación)
        if: steps.firma.outputs.firmado == 'no'
        working-directory: movil/ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App \
            -configuration Release -sdk iphoneos build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO

      - name: Publicar el .ipa
        if: steps.firma.outputs.firmado == 'si'
        uses: actions/upload-artifact@v4
        with:
          name: calendario-ios
          if-no-files-found: error
          path: ${{ runner.temp }}/export/*.ipa
